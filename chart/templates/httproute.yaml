{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gmail-archive-sync.fullname" . }}
  labels:
    {{- include "gmail-archive-sync.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    - {{ .Values.gateway.host | quote }}
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: {{ include "gmail-archive-sync.fullname" . }}-http
          port: {{ .Values.http.port }}
{{- end }}
