{{- if .Values.networkPolicy.enabled }}
{{- $to := .Values.networkPolicy.egressTo }}
{{- $ports := .Values.networkPolicy.egressPorts }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gmail-archive-sync.fullname" . }}
  labels:
    {{- include "gmail-archive-sync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gmail-archive-sync.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: {{ .Values.http.port }}, protocol: TCP }
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # PostgreSQL
    - ports:
        - { port: {{ $ports.postgres }}, protocol: TCP }
      {{- with $to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # IMAP destination
    - ports:
        {{- range $ports.imap }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
      {{- with $to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Gmail API, Google OAuth, the OIDC issuer and the Kubernetes API
    - ports:
        - { port: {{ $ports.https }}, protocol: TCP }
      {{- with $to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
