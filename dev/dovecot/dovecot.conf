# Throwaway Dovecot 2.4 for local testing: one user, Maildir, "/" separator, plain IMAP on 143.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
log_path = /dev/stderr
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

mail_driver = maildir
mail_home = /tmp/mail/%{user}
mail_path = ~/Maildir

mail_uid = vmail
mail_gid = vmail

# The image only has the vmail user and runs unprivileged.
base_dir = /tmp/run
state_dir = /tmp/run
default_login_user = vmail
default_internal_user = vmail
default_internal_group = vmail

namespace inbox {
  inbox = yes
  separator = /
}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /tmp/mail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}
